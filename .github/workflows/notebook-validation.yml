name: Notebook validation

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "requirements.txt"
      - ".github/workflows/notebook-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "notebooks/**"
      - "requirements.txt"
      - ".github/workflows/notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert

      - name: Execute analysis notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/ab_test_analysis.ipynb \
            --output executed_ab_test_analysis.ipynb \
            --output-dir . \
            --ExecutePreprocessor.timeout=300

      - name: Verify notebook execution output exists
        run: test -s executed_ab_test_analysis.ipynb
